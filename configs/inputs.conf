[default]
host = CORP-WORKSTATION01

# 1. Windows Security, System, and Application Event Logs
[WinEventLog://Security]
disabled = 0
index = wineventlog
renderXml = true
current_only = 0

[WinEventLog://System]
disabled = 0
index = wineventlog
renderXml = true
current_only = 0

[WinEventLog://Application]
disabled = 0
index = wineventlog
renderXml = true
current_only = 0

# 2. Sysmon EDR Telemetry
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = edr_sysmon
renderXml = true
current_only = 0

# 3. Suricata IDS / IPS Network Logs (eve.json)
[monitor://C:\Program Files\Suricata\log\eve.json]
disabled = 0
index = ids_suricata
sourcetype = suricata:eve

# 4. Windows Firewall Logs
[monitor://C:\Windows\System32\LogFiles\Firewall\pfirewall.log]
disabled = 0
index = network_fw
sourcetype = windows:firewall
